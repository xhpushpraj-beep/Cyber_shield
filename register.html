<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Cyber Shield</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            🛡️ Cyber Shield
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="password-checker.html">
                Password Checker
            </a>

            <a href="url-checker.html">
                URL Checker
            </a>

            <a href="phishing.html">
                Phishing
            </a>

            <a href="tips.html">
                Safety Tips
            </a>

            <a href="report.html">
                Report
            </a>

        </div>

    </nav>



    <!-- Register Section -->

    <section class="password-page">

        <div class="password-box register-box">


            <h1>
                👤 Create Account
            </h1>


            <p>
                Register to access your Cyber Shield dashboard.
            </p>



            <form id="registerForm">


                <!-- Full Name -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                >



                <!-- Email -->

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >



                <!-- Profile Photo -->

                <label for="profilePhoto">
                    Profile Photo
                </label>

                <input
                    type="file"
                    id="profilePhoto"
                    accept="image/*"
                >



                <!-- Password -->

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                >



                <!-- Confirm Password -->

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                >



                <!-- Create Account -->

                <button
                    type="submit"
                    class="check-btn">

                    Create Account

                </button>



                <!-- Result -->

                <div
                    id="registerResult"
                    class="password-result">
                </div>


            </form>



            <!-- Login Link -->

            <p class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </div>

    </section>



    <!-- Footer -->

    <footer>

        <p>
            Developed by Mamta Pushpendra Gautam
        </p>

        <p>
            TY B.Sc. Computer Science
        </p>

        <p>
            © 2026 Cyber Shield | Academic Project
        </p>

    </footer>



    <!-- JavaScript -->

    <script src="js/register.js"></script>


</body>

</html>
